<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SIMBG Gresik — Daftar Link</title>
<style>
  /* ====================================================
     GANTI WALLPAPER DI SINI
     Ganti "assets/wallpaper.jpg" dengan nama file foto kamu
     ==================================================== */
  body {
    margin: 0;
    min-height: 100vh;
    background-image:
      linear-gradient(180deg, rgba(8,20,40,0.75), rgba(8,20,40,0.9)),
      url("assets/wallpaper.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    font-family: 'Segoe UI', Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 50px 16px;
    position: relative;
  }
  .card {
    width: 100%;
    max-width: 420px;
    text-align: center;
  }
  /* ====================================================
     LOGO
     ==================================================== */
  .logo {
    width: 110px;
    height: 110px;
    object-fit: contain;
    margin-bottom: 10px;
  }
  h1 {
    color: #FFD873;
    font-size: 20px;
    margin: 10px 0 6px;
  }
  .subtitle {
    color: #EAF1FF;
    font-size: 13.5px;
    line-height: 1.5;
    margin: 0 0 26px;
    opacity: 0.9;
  }
  /* ====================================================
     TOMBOL LINK
     ==================================================== */
  .link-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #F6F3EA;
    color: #0A1628;
    font-weight: 600;
    font-size: 14.5px;
    text-decoration: none;
    padding: 14px 16px;
    margin-bottom: 12px;
    border-left: 4px solid #F0B429;
    border-radius: 4px;
    transition: background 0.2s ease;
  }
  .link-btn:hover {
    background: #FFFFFF;
  }
  .link-btn .icon {
    font-size: 18px;
    flex: 0 0 auto;
  }
  footer {
    margin-top: 20px;
    color: rgba(255,255,255,0.5);
    font-size: 11.5px;
  }

  /* ====================================================
     TOMBOL MUSIK (pojok kanan atas)
     ==================================================== */
  .music-btn {
    position: fixed;
    top: 16px;
    right: 16px;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: rgba(246, 243, 234, 0.95);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 999;
    box-shadow: 0 2px 6px rgba(0,0,0,0.35);
    transition: transform 0.15s ease, background 0.2s ease;
  }
  .music-btn:hover {
    background: #FFFFFF;
    transform: scale(1.05);
  }
  .music-btn svg {
    width: 20px;
    height: 20px;
    fill: #0A1628;
  }
  .music-btn.playing {
    animation: pulse 1.5s infinite ease-in-out;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(240,180,41,0.5); }
    50% { box-shadow: 0 0 0 8px rgba(240,180,41,0); }
  }
</style>
</head>
<body>

  <!-- ================================================
       TOMBOL PLAY MUSIK
       Ganti "assets/lagu.mp3" dengan file lagu kamu
       ================================================ -->
  <audio id="bgMusic" src="assets/lagu.mp3" loop></audio>
  <button class="music-btn" id="musicBtn" title="Putar musik" aria-label="Putar atau jeda musik">
    <svg id="iconPlay" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    <svg id="iconPause" viewBox="0 0 24 24" style="display:none"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
  </button>

  <div class="card">
    <!-- ================= LOGO ================= -->
    <img class="logo" src="assets/logo.png" alt="Logo SIMBG Gresik">
    <!-- ================= JUDUL ================= -->
    <h1>Daftar Link Serbaguna SIMBG</h1>
    <p class="subtitle">Tetap semangat melayani dan memastikan keandalan bangunan di Gresik</p>
    <!-- ================================================
         DAFTAR LINK — GANTI URL DI href="..." DI BAWAH INI
         Salin satu blok <a>...</a> untuk menambah tombol baru
         ================================================ -->
    <a class="link-btn" href="https://script.google.com/macros/s/AKfycbxXC-2BswevKByrrXRBLpfSsUJf1khqJkAGDQMqMpkrb0EcrtEvs2g83ioXFRTdMMgs/exec" target="_blank">
      <span class="icon">📱</span>
      Website Aplikasi Super Master SIMBG
    </a>
    <a class="link-btn" href="https://drive.google.com/drive/folders/17WOt-qZilYArpQeI-JsOscskflPXW_kK" target="_blank">
      <span class="icon">🔗</span>
      Drive SIMBG 2026
    </a>
    <a class="link-btn" href="https://docs.google.com/spreadsheets/d/1m7r3SLQZbnjBEhdrR9BRTtzNx0RzENA37smcVQrkbrk" target="_blank">
      <span class="icon">✉️</span>
      Master Agenda SIMBG 2026
    </a>
    <footer>© 2026 SIMBG Gresik</footer>
  </div>

  <script>
    const musicBtn = document.getElementById('musicBtn');
    const bgMusic = document.getElementById('bgMusic');
    const iconPlay = document.getElementById('iconPlay');
    const iconPause = document.getElementById('iconPause');

    function showPlayingUI() {
      iconPlay.style.display = 'none';
      iconPause.style.display = 'block';
      musicBtn.classList.add('playing');
    }

    function showPausedUI() {
      iconPlay.style.display = 'block';
      iconPause.style.display = 'none';
      musicBtn.classList.remove('playing');
    }

    // Coba autoplay begitu halaman siap
    function tryAutoplay() {
      const playPromise = bgMusic.play();
      if (playPromise !== undefined) {
        playPromise.then(() => {
          showPlayingUI();
        }).catch(() => {
          // Diblokir browser: tunggu interaksi pertama untuk mulai otomatis
          showPausedUI();
          const startOnInteraction = () => {
            bgMusic.play().then(showPlayingUI).catch(() => {});
            document.removeEventListener('click', startOnInteraction);
            document.removeEventListener('touchstart', startOnInteraction);
          };
          document.addEventListener('click', startOnInteraction, { once: true });
          document.addEventListener('touchstart', startOnInteraction, { once: true });
        });
      }
    }

    window.addEventListener('DOMContentLoaded', tryAutoplay);

    // Tombol pojok kanan atas: klik untuk pause / play manual
    musicBtn.addEventListener('click', (e) => {
      e.stopPropagation(); // supaya tidak dianggap "klik pertama di halaman" ganda
      if (bgMusic.paused) {
        bgMusic.play().then(showPlayingUI).catch(() => {});
      } else {
        bgMusic.pause();
        showPausedUI();
      }
    });
  </script>
</body>
</html>
